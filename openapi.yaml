            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ========== 指标 ==========
  /api/metrics:
    get:
      tags: [指标]
      summary: 查询抓取指标
      security:
        - BearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: 起始时间（ISO 8601）
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: 结束时间（ISO 8601）
        - name: adapter
          in: query
          schema:
            type: string
          description: 适配器名称（指定则返回单个，不指定则返回数组）
      responses:
        "200":
          description: 指标数据
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MetricData"
                  - type: array
                    items:
                      $ref: "#/components/schemas/MetricData"
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/metrics/adapters:
    get:
      tags: [指标]
      summary: 获取有指标数据的适配器列表
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 适配器名称列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ========== 调优 ==========
  /api/tuning/suggestions:
    get:
      tags: [调优]
      summary: 获取调优建议
      security:
        - BearerAuth: []
      parameters:
        - name: adapter
          in: query
          schema:
            type: string
          description: 按适配器过滤
      responses:
        "200":
          description: 建议列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TuningSuggestion"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [调优]
      summary: 生成调优建议
      security:
        - BearerAuth: []
      parameters:
        - name: adapter
          in: query
          required: true
          schema:
            type: string
        - name: max
          in: query
          schema:
            type: integer
            default: 5
          description: 最大建议数量
      responses:
        "200":
          description: 生成的建议
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TuningSuggestion"
        "400":
          description: 缺少 adapter 参数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/tuning/suggestions/{id}/apply:
    post:
      tags: [调优]
      summary: 应用调优建议
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 应用成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied:
                    type: object
                    additionalProperties: {}
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 建议不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/tuning/suggestions/{id}/reject:
    post:
      tags: [调优]
      summary: 拒绝调优建议
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 拒绝成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  rejected:
                    type: string
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 建议不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/tuning/experiments:
    get:
      tags: [调优]
      summary: 获取调优实验列表
      security:
        - BearerAuth: []
      parameters:
        - name: adapter
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 实验列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TuningExperiment"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [调优]
      summary: 创建调优实验
      security:
        - BearerAuth: []
      parameters:
        - name: adapter
          in: query
          required: true
          schema:
            type: string
        - name: durationMinutes
          in: query
          schema:
            type: integer
            default: 60
          description: 实验时长（分钟）
      responses:
        "201":
          description: 实验创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TuningExperiment"
        "400":
          description: 缺少 adapter 参数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/tuning/history:
    get:
      tags: [调优]
      summary: 获取调优历史记录
      security:
        - BearerAuth: []
      parameters:
        - name: adapter
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 历史记录列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TuningHistory"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/tuning/history/{id}/rollback:
    post:
      tags: [调优]
      summary: 回滚调优变更
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 回滚成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TuningHistory"
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 记录不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ========== 采集 ==========
  /api/ingest:
    post:
      tags: [采集]
      summary: 采集页面快照
      description: 浏览器扩展提交页面快照，需要通过 X-Local-Token 头认证。
      security:
        - LocalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [finalUrl]
              properties:
                finalUrl:
                  type: string
                  description: 最终 URL
                canonicalUrl:
                  type: string
                  description: 标准 URL
                title:
                  type: string
                capturedAt:
                  type: string
                  format: date-time
                  description: 采集时间（默认当前时间）
                rawHtml:
                  type: string
                  description: 原始 HTML
                bodyText:
                  type: string
                  description: 正文文本
                metadata:
                  type: string
                  description: 元数据 JSON
                imageUrls:
                  type: array
                  items:
                    type: string
                  description: 图片 URL 列表
      responses:
        "200":
          description: 已存在（重复快照）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [duplicate]
                  id:
                    type: integer
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [created]
                  id:
                    type: integer
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Token 认证失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: 请求体过大（超过 10MB）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 在 Authorization 头中传递 JWT 令牌（Bearer <token>）
    LocalToken:
      type: apiKey
      in: header
      name: X-Local-Token
      description: 浏览器扩展使用的本地认证令牌

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: 错误信息

    Article:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        body:
          type: string
        source:
          type: string
        publishedAt:
          type: string
          format: date-time
          nullable: true
        url:
          type: string
          nullable: true
        fetchedAt:
          type: string
          format: date-time
          nullable: true
        summary:
          type: string
          nullable: true

    ArticleList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Article"
        total:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
        limit:
          type: integer
          format: int64

    SearchResult:
      type: object
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Article"
              - type: object
                properties:
                  score:
                    type: number
                    format: double
        total:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
        limit:
          type: integer
          format: int64

    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
          nullable: true
        role:
          type: string
          enum: [USER, ADMIN]
        createdAt:
          type: string
          format: date-time

    Adapter:
      type: object
      properties:
        name:
          type: string
        interval:
          type: integer
          format: int64
        running:
          type: boolean
        lastFetchedAt:
          type: string
          format: date-time
          nullable: true

    Credential:
      type: object
      properties:
        id:
          type: integer
          format: int64
        adapterName:
          type: string
        type:
          type: string
          enum: [cookie, token]
        isActive:
          type: boolean
        isRevoked:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true
        priority:
          type: integer

    TaskList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaskExecution"
        total:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
        limit:
          type: integer

    TaskExecution:
      type: object
      properties:
        id:
          type: integer
          format: int64
        adapterName:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        durationMs:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
        errorMessage:
          type: string
          nullable: true
        articleCount:
          type: integer

    AdapterStats:
      type: object
      properties:
        adapterName:
          type: string
        totalRuns:
          type: integer
        successCount:
          type: integer
        errorCount:
          type: integer
        successRate:
          type: number
          format: double
        avgDurationMs:
          type: number
          format: double

    LogEntry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        level:
          type: string
        logger:
          type: string
        message:
          type: string

    NotificationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        total:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
        limit:
          type: integer

    Notification:
      type: object
      properties:
        id:
          type: string
        sourceAdapter:
          type: string
        articleCount:
          type: integer
        subject:
          type: string
        body:
          type: string
        status:
          type: string
          nullable: true
        channelName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        retryCount:
          type: integer
        lastError:
          type: string
          nullable: true

    Subscription:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        adapterNames:
          type: array
          items:
            type: string
        keywords:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FeedResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Article"
        hasMore:
          type: boolean
        offset:
          type: integer
          format: int64
        limit:
          type: integer

    BookmarkList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Bookmark"
        total:
          type: integer
          format: int64
        hasMore:
          type: boolean
        offset:
          type: integer
          format: int64
        limit:
          type: integer

    Bookmark:
      type: object
      properties:
        id:
          type: integer
          format: int64
        articleId:
          type: integer
          format: int64
        title:
          type: string
        body:
          type: string
        source:
          type: string
        publishedAt:
          type: string
          format: date-time
          nullable: true
        url:
          type: string
          nullable: true
        fetchedAt:
          type: string
          format: date-time
          nullable: true
        bookmarkedAt:
          type: string
          format: date-time

    UserPreference:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        notificationFrequency:
          type: string
          enum: [immediate, daily, weekly, disabled]
        minArticleLength:
          type: integer
        articlesPerPage:
          type: integer
        theme:
          type: string
          enum: [light, dark, system]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReadingProgress:
      type: object
      properties:
        articleId:
          type: integer
          format: int64
        scrollPosition:
          type: integer
        lastReadAt:
          type: string
          format: date-time

    ExportRequest:
      type: object
      properties:
        format:
          type: string
          enum: [json, csv, markdown, epub]
          default: json
          description: 导出格式
        source:
          type: string
          nullable: true
          description: 按来源过滤
        startDate:
          type: string
          format: date-time
          nullable: true
        endDate:
          type: string
          format: date-time
          nullable: true
        keyword:
          type: string
          nullable: true
          description: 按关键词过滤

    ExportTask:
      type: object
      properties:
        taskId:
          type: string
        status:
          type: string
        progress:
          type: number
        error:
          type: string
          nullable: true
        downloadUrl:
          type: string
          nullable: true
          description: 完成后可用的下载地址
        createdAt:
          type: string
          format: date-time

    HealthStatus:
      type: object
      properties:
        adapterName:
          type: string
        healthy:
          type: boolean
        consecutiveFailures:
          type: integer
        lastFailureCategory:
          type: string
          nullable: true
        lastErrorMessage:
          type: string
          nullable: true
        lastSuccessAt:
          type: string
          format: date-time
          nullable: true
        lastFailureAt:
          type: string
          format: date-time
          nullable: true
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true

    HealingRecord:
      type: object
      properties:
        id:
          type: string
        adapterName:
          type: string
        status:
          type: string
        triggerReason:
          type: string
          nullable: true
        diagnosis:
          type: object
          nullable: true
          properties:
            failureCategory:
              type: string
            errorMessage:
              type: string
              nullable: true
            confidence:
              type: number
            suggestedStrategy:
              type: string
              nullable: true
        repairStrategy:
          type: string
          nullable: true
        repairDescription:
          type: string
          nullable: true
        snapshotBefore:
          type: string
          nullable: true
        verificationPassed:
          type: boolean
        repairAttempt:
          type: integer
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    SiteSnapshot:
      type: object
      properties:
        id:
          type: string
        domain:
          type: string
        adapterName:
          type: string
        cssSelectors:
          type: object
          additionalProperties:
            type: string
        apiResponseFormat:
          type: string
          nullable: true
        capturedAt:
          type: string
          format: date-time

    SiteParams:
      type: object
      properties:
        id:
          type: string
        domain:
          type: string
        adapterName:
          type: string
        optimalRequestsPerSecond:
          type: number
        optimalDelayMs:
          type: number
        preferredProxyProtocol:
          type: string
          nullable: true
        simulationPreset:
          type: string
          nullable: true
        successRate:
          type: number
        sampleSize:
          type: integer
        calculatedAt:
          type: string
          format: date-time

    SiteChange:
      type: object
      properties:
        id:
          type: string
        domain:
          type: string
        adapterName:
          type: string
        changeType:
          type: string
        description:
          type: string
          nullable: true
        snapshotBeforeId:
          type: string
          nullable: true
        snapshotAfterId:
          type: string
          nullable: true
        detectedAt:
          type: string
          format: date-time

    Plugin:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        apiVersion:
          type: string
        entryClass:
          type: string
        compatible:
          type: boolean
        compatibilityStatus:
          type: string
        installed:
          type: boolean
        sourcePath:
          type: string
        lastError:
          nullable: true

    MetricData:
      type: object
      properties:
        adapterId:
          type: string
        totalCount:
          type: integer
        successCount:
          type: integer
        blockedCount:
          type: integer
        successRate:
          type: number
          format: double
        blockedRate:
          type: number
          format: double
        avgResponseTimeMs:
          type: number
          format: double

    TuningSuggestion:
      type: object
      properties:
        id:
          type: string
        adapterId:
          type: string
        currentParams:
          type: object
          additionalProperties: {}
        suggestedParams:
          type: object
          additionalProperties: {}
        expectedImprovement:
          type: number
        rationale:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time

    TuningExperiment:
      type: object
      properties:
        id:
          type: string
        adapterId:
          type: string
        durationMinutes:
          type: integer
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        groups:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              params:
                type: object
                additionalProperties: {}
              metrics:
                type: object
                nullable: true
                properties:
                  totalRequests:
                    type: integer
                  successCount:
                    type: integer
                  blockedCount:
                    type: integer
                  blockedRate:
                    type: number

    TuningHistory:
      type: object
      properties:
        id:
          type: string
        adapterId:
          type: string
        previousParams:
          type: object
          additionalProperties: {}
        newParams:
          type: object
          additionalProperties: {}
        expectedImprovement:
          type: number
        rationale:
          type: string
        appliedAt:
          type: string
          format: date-time
        isRollback:
          type: boolean
