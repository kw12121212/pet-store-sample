openapi: 3.1.0
info:
  title: auto-read API
  version: 1.0.0
  description: auto-read 内容聚合平台 API，用于管理文章抓取、用户订阅、数据导出等功能。
  contact:
    name: auto-read 团队

servers:
  - url: /
    description: 当前服务

security: []

tags:
  - name: 文章
    description: 文章查询与搜索
  - name: 认证
    description: 用户注册与登录
  - name: 订阅
    description: 用户内容订阅管理
  - name: 信息流
    description: 个性化内容推送
  - name: 书签
    description: 文章收藏管理
  - name: 阅读进度
    description: 文章阅读位置记录
  - name: 用户偏好
    description: 用户个性化设置
  - name: 摘要
    description: AI 文章摘要生成
  - name: 适配器
    description: 抓取适配器管理
  - name: 凭证
    description: 适配器凭证管理
  - name: 监控
    description: 任务执行监控
  - name: 通知
    description: 系统通知管理
  - name: 导出
    description: 文章数据导出
  - name: 健康
    description: 适配器健康状态
  - name: 自愈
    description: 适配器自愈管理
  - name: 站点知识
    description: 站点抓取知识库
  - name: 插件
    description: 插件生命周期管理
  - name: 指标
    description: 抓取指标查询
  - name: 调优
    description: 抓取参数调优
  - name: 采集
    description: 浏览器扩展内容采集

paths:
  # ========== 文章 ==========
  /api/articles:
    get:
      tags: [文章]
      summary: 获取文章列表
      description: 分页查询文章，支持按来源、关键词、标签和日期范围过滤。
      parameters:
        - name: source
          in: query
          schema:
            type: string
          description: 按来源过滤
        - name: keyword
          in: query
          schema:
            type: string
          description: 按标题关键词过滤
        - name: tag
          in: query
          schema:
            type: string
          description: 按标签过滤
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
          description: 起始日期（ISO 8601）
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
          description: 结束日期（ISO 8601）
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: 页码
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
          description: 每页数量
      responses:
        "200":
          description: 文章列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleList"
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/articles/search:
    get:
      tags: [文章]
      summary: 全文搜索文章
      description: 对文章标题和正文进行全文检索，结果按相关度排序。
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: 搜索关键词
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
      responses:
        "200":
          description: 搜索结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "400":
          description: 缺少搜索关键词
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/articles/{articleId}:
    get:
      tags: [文章]
      summary: 获取单篇文章
      parameters:
        - name: articleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 文章详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          description: 无效的 ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 文章不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/articles/{articleId}/summary:
    post:
      tags: [摘要]
      summary: 生成文章 AI 摘要
      security:
        - BearerAuth: []
      parameters:
        - name: articleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 摘要生成结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: string
                    nullable: true
        "400":
          description: 无效的文章 ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 文章不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: 摘要服务不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ========== 认证 ==========
  /api/auth/register:
    post:
      tags: [认证]
      summary: 用户注册
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                password:
                  type: string
                  minLength: 8
                displayName:
                  type: string
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: 参数验证失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 用户名已存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login:
    post:
      tags: [认证]
      summary: 用户登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT 令牌
        "401":
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ========== 适配器 ==========
  /api/adapters:
    get:
      tags: [适配器]
      summary: 获取适配器列表
      description: 返回所有已注册适配器的状态信息。
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 适配器列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Adapter"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/adapters/{name}/{action}:
    post:
      tags: [适配器]
      summary: 控制适配器
      description: 执行 start、stop 或 fetch 操作。
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: 适配器名称
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [start, stop, fetch]
          description: 操作类型
      responses:
        "200":
          description: 操作结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  started:
                    type: boolean
                    description: 仅 start 操作返回
                  stopped:
                    type: boolean
                    description: 仅 stop 操作返回
                  triggered:
                    type: boolean
                    description: 仅 fetch 操作返回
        "400":
          description: 无效路径
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 适配器不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/adapters/{name}/interval:
    put:
      tags: [适配器]
      summary: 更新适配器抓取间隔
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [interval]
              properties:
                interval:
                  type: integer
                  format: int64
                  minimum: 1
                  description: 抓取间隔（秒）
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  interval:
                    type: integer
                    format: int64
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ========== 凭证 ==========
  /api/credentials:
    get:
      tags: [凭证]
      summary: 获取凭证列表
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 凭证列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credential"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/credentials/{adapterName}:
    post:
      tags: [凭证]
      summary: 添加凭证
      security:
        - BearerAuth: []
      parameters:
        - name: adapterName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [cookie, token]
                token:
                  type: string
                  description: type 为 token 时必填
                cookies:
                  type: object
                  additionalProperties:
                    type: string
                  description: type 为 cookie 时必填
                priority:
                  type: integer
                  default: 0
                expiresAt:
                  type: string
                  format: date-time
                  description: 过期时间（ISO 8601）
      responses:
        "200":
          description: 保存成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  adapterName:
                    type: string
                  saved:
                    type: boolean
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/credentials/{adapterName}/refresh:
    post:
      tags: [凭证]
      summary: 刷新适配器凭证
      security:
        - BearerAuth: []
      parameters:
        - name: adapterName
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 刷新结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  adapterName:
                    type: string
                  refreshed:
                    type: boolean
                  reason:
                    type: string
                    nullable: true
                    description: 仅刷新失败时返回
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/credentials/{adapterName}/{id}:
    delete:
      tags: [凭证]
      summary: 撤销凭证
      security:
        - BearerAuth: []
      parameters:
        - name: adapterName
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 撤销成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  adapterName:
                    type: string
                  credentialId:
                    type: integer
                    format: int64
                  revoked:
                    type: boolean
        "400":
          description: 无效的凭证 ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ========== 监控 ==========
  /api/monitor/tasks:
    get:
      tags: [监控]
      summary: 获取任务执行记录
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
        - name: adapter
          in: query
          schema:
            type: string
          description: 按适配器过滤
        - name: status
          in: query
          schema:
            type: string
            enum: [success, error]
          description: 按状态过滤
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/monitor/stats:
    get:
      tags: [监控]
      summary: 获取适配器统计信息
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 统计信息列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdapterStats"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/monitor/errors:
    get:
      tags: [监控]
      summary: 获取错误任务记录
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
        - name: adapter
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: 错误任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/monitor/logs:
    get:
      tags: [监控]
      summary: 获取系统日志
      security:
        - BearerAuth: []
      parameters:
        - name: level
          in: query
          schema:
            type: string
          description: 按日志级别过滤
        - name: search
          in: query
          schema:
            type: string
          description: 搜索关键词
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 1000
          description: 返回条数
      responses:
        "200":
          description: 日志列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ========== 通知 ==========
  /api/notifications:
    get:
      tags: [通知]
      summary: 获取通知列表
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
        - name: status
          in: query
          schema:
            type: string
          description: 按状态过滤
        - name: adapter
          in: query
          schema:
            type: string
          description: 按适配器过滤
      responses:
        "200":
          description: 通知列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/notifications/adapters:
    get:
      tags: [通知]
      summary: 获取通知来源适配器列表
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 适配器名称列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ========== 订阅 ==========
  /api/subscriptions:
    get:
      tags: [订阅]
      summary: 获取当前用户订阅
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 已有订阅
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "201":
          description: 新创建的订阅
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [订阅]
      summary: 更新订阅配置
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                adapterNames:
                  type: array
                  items:
                    type: string
                  nullable: true
                  description: 订阅的适配器列表，null 表示不修改，空数组表示清空
                keywords:
                  type: array
                  items:
                    type: string
                  nullable: true
                  description: 订阅关键词列表，null 表示不修改，空数组表示清空
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [订阅]
      summary: 删除订阅
      security:
        - BearerAuth: []
      responses:
        "204":
          description: 删除成功
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 订阅不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/subscriptions/recommendations:
    get:
      tags: [订阅]
      summary: 获取推荐适配器
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 推荐适配器名称列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: 服务器错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/subscriptions/toggle:
    put:
      tags: [订阅]
      summary: 切换订阅启用状态
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 切换成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
